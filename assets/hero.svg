<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Thiago Kaoru — Senior Software Engineer</title>
  <desc id="description">An animated architectural system map with flowing data, gently floating components and a rotating focus line beside Thiago Kaoru's name.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080F1B"/><stop offset=".53" stop-color="#091321"/><stop offset="1" stop-color="#101429"/>
    </linearGradient>
    <linearGradient id="name" x1="58" y1="0" x2="530" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3D2"/><stop offset=".54" stop-color="#91DEEB"/><stop offset="1" stop-color="#A9B6FF"/>
    </linearGradient>
    <linearGradient id="edge" x1="760" y1="80" x2="1180" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CF7D0" stop-opacity=".48"/><stop offset=".54" stop-color="#73C7FA" stop-opacity=".25"/><stop offset="1" stop-color="#A08FFF" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91E6E3" stop-opacity="0"/><stop offset=".48" stop-color="#91E6E3" stop-opacity=".055"/><stop offset="1" stop-color="#91E6E3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(951 206) rotate(90) scale(225 298)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C617D" stop-opacity=".26"/><stop offset=".54" stop-color="#343665" stop-opacity=".13"/><stop offset="1" stop-color="#172239" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="0" cy="0" r="1" gradientTransform="translate(0 0) scale(73)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84DCD3" stop-opacity=".19"/><stop offset="1" stop-color="#84DCD3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" stroke="#9CB0D7" stroke-opacity=".072" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.05" fill="#9FB8E4" fill-opacity=".18"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="408" rx="21"/></clipPath>
    <clipPath id="screen"><rect x="728" y="68" width="424" height="282" rx="15"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <style><![CDATA[
      /* GitHub README friendly: image-only SVG motion, no scripts or external dependencies. */
      .appear { animation: reveal .9s ease-out both; }
      .appear-later { animation: reveal 1.15s .25s ease-out both; }
      .flux { stroke-dasharray: 3 9; animation: flow 3.1s linear infinite; }
      .flux-reverse { stroke-dasharray: 3 9; animation: flow-reverse 4.4s linear infinite; }
      .ring { transform-origin: 956px 205px; animation: orbit 34s linear infinite; }
      .breathe { transform-origin: 956px 205px; animation: breathe 5.8s ease-in-out infinite; }
      .hover-a { animation: hover 6.3s ease-in-out infinite; }
      .hover-b { animation: hover 7.3s -2.1s ease-in-out infinite; }
      .hover-c { animation: hover 8.6s -3.6s ease-in-out infinite; }
      .hover-d { animation: hover 7.7s -1.3s ease-in-out infinite; }
      .scanner { animation: scan 10s ease-in-out infinite; }
      .status { animation: blink 3s ease-in-out infinite; }
      .caret { animation: cursor 1.2s steps(1) infinite; }
      .caption-1 { animation: message1 12s infinite; }
      .caption-2 { animation: message2 12s infinite; opacity: 0; }
      .caption-3 { animation: message3 12s infinite; opacity: 0; }
      .packet1, .packet2, .packet3, .packet4 { filter: drop-shadow(0px 0px 5px #6EDDE5); }
      @keyframes reveal { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0px) } }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes flow-reverse { to { stroke-dashoffset: 48; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% {opacity:.48; transform: scale(.94)} 50% {opacity:.95; transform:scale(1.15)} }
      @keyframes hover { 0%, 100% {transform:translateY(0px)} 50% {transform:translateY(-7px)} }
      @keyframes scan { 0%,9% { transform:translateX(-130px);opacity:0 } 25% {opacity:1} 65% {transform:translateX(440px);opacity:.5} 66%,100% {transform:translateX(440px);opacity:0} }
      @keyframes blink {0%,100%{opacity:1} 50%{opacity:.25}}
      @keyframes cursor {0%,49%{opacity:1} 50%,100%{opacity:0}}
      @keyframes message1 {0%,27%{opacity:1;transform:translateY(0)} 31%,96%{opacity:0;transform:translateY(-7px)} 100%{opacity:1;transform:translateY(0)}}
      @keyframes message2 {0%,29%{opacity:0;transform:translateY(7px)} 34%,60%{opacity:1;transform:translateY(0)} 65%,100%{opacity:0;transform:translateY(-7px)}}
      @keyframes message3 {0%,62%{opacity:0;transform:translateY(7px)} 68%,94%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-7px)}}
      @media (prefers-reduced-motion: reduce) {
        .appear,.appear-later,.flux,.flux-reverse,.ring,.breathe,.hover-a,.hover-b,.hover-c,.hover-d,.scanner,.status,.caret,.caption-1,.caption-2,.caption-3 { animation:none!important;transform:none!important; }
        .appear,.appear-later,.caption-1 { opacity:1!important; }
        .caption-2,.caption-3,.scanner { opacity:0!important; }
        .packet1,.packet2,.packet3,.packet4 { display:none; }
      }
    ]]></style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="410" fill="url(#background)"/>
    <rect width="1200" height="410" fill="url(#microgrid)"/>
    <circle cx="1010" cy="-40" r="260" fill="#4C46AD" opacity=".065" filter="url(#blur)"/>
    <rect x="692" width="508" height="410" fill="url(#halo)"/>
    <path d="M702 0V410" stroke="#C3D1EF" stroke-opacity=".09"/>
    <path d="M0 362H1200" stroke="#D1E0F7" stroke-opacity=".10"/>

    <!-- Deliberate editorial typography; no external font requests. -->
    <g class="appear">
      <rect x="54" y="41" width="30" height="2" rx="1" fill="#99F3D0"/>
      <text x="98" y="47" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.6" fill="#B1C8DA">THIAGO / ENGINEERING</text>
      <text x="641" y="47" text-anchor="end" font-family="monospace" font-size="11" letter-spacing="1.25" fill="#6E88A3">PROFILE · 2026</text>
    </g>
    <g class="appear-later">
      <text x="52" y="167" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.5" fill="#F3F6FE">Thiago</text>
      <text x="52" y="249" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3.5" fill="url(#name)">Kaoru<tspan fill="#A6F4D0">.</tspan></text>
      <text x="56" y="290" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#E0EAF5">Senior Software Engineer</text>
      <g font-family="Arial, Helvetica, sans-serif" font-size="16.5" fill="#9EB6CE">
        <text class="caption-1" x="56" y="321">Building products at scale.<tspan class="caret" fill="#91E9D3"> ▍</tspan></text>
        <text class="caption-2" x="56" y="321">Designing reliable distributed systems.<tspan class="caret" fill="#91E9D3"> ▍</tspan></text>
        <text class="caption-3" x="56" y="321">Exploring AI engineering &amp; agents.<tspan class="caret" fill="#91E9D3"> ▍</tspan></text>
      </g>
    </g>

    <!-- Status footer -->
    <circle class="status" cx="59" cy="386" r="4" fill="#9AF2C8"/>
    <text x="73" y="391" font-family="monospace" font-size="12" letter-spacing="1" fill="#A3C2CF">BASED IN BRAZIL</text>
    <text x="641" y="391" text-anchor="end" font-family="monospace" font-size="12" letter-spacing=".9" fill="#7993AB">BUILD  /  SHIP  /  IMPROVE</text>

    <!-- Runtime card -->
    <rect x="728" y="68" width="424" height="282" rx="15" fill="#0C1928" fill-opacity=".9" stroke="#9DC9DE" stroke-opacity=".20"/>
    <g clip-path="url(#screen)">
      <path d="M729 110H1151" stroke="#AEC7DC" stroke-opacity=".13"/>
      <rect x="728" y="110" width="424" height="240" fill="url(#microgrid)" opacity=".5"/>
      <g class="scanner"><rect x="728" y="110" width="110" height="240" fill="url(#sweep)"/></g>
    </g>
    <circle class="status" cx="754" cy="90" r="4" fill="#A5EFD4"/>
    <circle cx="769" cy="90" r="4" fill="#72B9DB" opacity=".55"/>
    <circle cx="784" cy="90" r="4" fill="#8894CF" opacity=".38"/>
    <text x="812" y="94" font-family="monospace" font-size="12" fill="#B4C9DA">system.map</text>
    <text x="1126" y="94" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="1.1" fill="#8BA4C0">● LIVE</text>

    <!-- Four signal paths, both static and animated. -->
    <g stroke-width="1.7" stroke-linecap="round" fill="none">
      <path d="M875 166C904 166 914 191 932 201" stroke="#77B6D3" stroke-opacity=".22"/>
      <path d="M875 166C904 166 914 191 932 201" class="flux" stroke="#A2F1D2" stroke-opacity=".66"/>
      <path d="M1031 150C1013 160 997 181 979 195" stroke="#77B6D3" stroke-opacity=".22"/>
      <path d="M1031 150C1013 160 997 181 979 195" class="flux-reverse" stroke="#9DD8FF" stroke-opacity=".7"/>
      <path d="M1034 264C1007 263 996 230 979 216" stroke="#77B6D3" stroke-opacity=".22"/>
      <path d="M1034 264C1007 263 996 230 979 216" class="flux" stroke="#B3A7FF" stroke-opacity=".72"/>
      <path d="M879 266C907 264 917 230 932 215" stroke="#77B6D3" stroke-opacity=".22"/>
      <path d="M879 266C907 264 917 230 932 215" class="flux-reverse" stroke="#9AE6CF" stroke-opacity=".7"/>
    </g>
    <!-- Animated data packets. Animated SVG image support is browser-dependent on GitHub. -->
    <circle class="packet1" r="3.3" fill="#B5FFE0"><animateMotion dur="3.2s" begin="0s" repeatCount="indefinite" path="M875 166C904 166 914 191 932 201"/></circle>
    <circle class="packet2" r="3" fill="#9BD9FF"><animateMotion dur="4s" begin="-1.4s" repeatCount="indefinite" path="M1031 150C1013 160 997 181 979 195"/></circle>
    <circle class="packet3" r="3.1" fill="#B4A7FF"><animateMotion dur="3.8s" begin="-1.9s" repeatCount="indefinite" path="M1034 264C1007 263 996 230 979 216"/></circle>
    <circle class="packet4" r="3" fill="#A0F6DA"><animateMotion dur="4.3s" begin="-.7s" repeatCount="indefinite" path="M879 266C907 264 917 230 932 215"/></circle>

    <!-- Central engine and an orbit that gently rotates. -->
    <circle cx="956" cy="205" r="73" fill="url(#hubGlow)"/>
    <circle class="breathe" cx="956" cy="205" r="58" stroke="#93EAD6" stroke-opacity=".45"/>
    <circle cx="956" cy="205" r="49" stroke="#94C3DF" stroke-opacity=".18"/>
    <circle cx="956" cy="205" r="39.5" fill="#102B3C" stroke="#B0E7DB" stroke-opacity=".62"/>
    <g class="ring"><circle cx="956" cy="205" r="67" stroke="#7DCBE3" stroke-opacity=".32" stroke-width="1.4" stroke-dasharray="5 10 2 15"/></g>
    <path d="M948 197L939 205L948 213M964 197L973 205L964 213M959 194L953 216" stroke="#BBFFE4" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="956" cy="138" r="3" fill="#A7F9D7"/>
    <circle cx="956" cy="272" r="2.3" fill="#90D4F8" opacity=".7"/>

    <!-- Four floating scope cards. -->
    <g class="hover-a">
      <rect x="751" y="143" width="126" height="48" rx="10" fill="#10293B" stroke="#8AD7CC" stroke-opacity=".44"/>
      <text x="765" y="161" font-family="monospace" font-size="10" letter-spacing="1.3" fill="#88AEBD">01 /</text>
      <text x="765" y="179" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#E9F5F4">PRODUCTS</text>
      <circle cx="858" cy="160" r="3" fill="#94F2D2"/>
    </g>
    <g class="hover-b">
      <rect x="1028" y="124" width="108" height="48" rx="10" fill="#10253A" stroke="#92C1ED" stroke-opacity=".42"/>
      <text x="1042" y="142" font-family="monospace" font-size="10" letter-spacing="1.3" fill="#88AEBD">02 /</text>
      <text x="1042" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#E9F5F4">SYSTEMS</text>
      <circle cx="1117" cy="141" r="3" fill="#9DDCFF"/>
    </g>
    <g class="hover-c">
      <rect x="1028" y="243" width="108" height="48" rx="10" fill="#16243A" stroke="#B4A4FF" stroke-opacity=".44"/>
      <text x="1042" y="261" font-family="monospace" font-size="10" letter-spacing="1.3" fill="#8CA4C2">03 /</text>
      <text x="1042" y="279" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#E9F5F4">AI AGENTS</text>
      <circle cx="1117" cy="260" r="3" fill="#B6ABFF"/>
    </g>
    <g class="hover-d">
      <rect x="751" y="244" width="130" height="48" rx="10" fill="#102A38" stroke="#8AD7CC" stroke-opacity=".38"/>
      <text x="765" y="262" font-family="monospace" font-size="10" letter-spacing="1.3" fill="#88AEBD">04 /</text>
      <text x="765" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#E9F5F4">RELIABILITY</text>
      <circle cx="861" cy="261" r="3" fill="#9AF2CF"/>
    </g>
    <path d="M748 323H1131" stroke="#A9C9DD" stroke-opacity=".13"/>
    <text x="753" y="337" font-family="monospace" font-size="10.5" letter-spacing="1.2" fill="#8FACC3">ENGINEERING / ALWAYS ITERATING</text>
    <text x="1126" y="337" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="1" fill="#9BDBD2">● ACTIVE</text>
    <path d="M728 386H1153" stroke="#A9C8DC" stroke-opacity=".15"/>
    <text x="734" y="393" font-family="monospace" font-size="10.5" letter-spacing=".8" fill="#8FA8C0">BUILD / 01</text>
    <text x="1153" y="393" text-anchor="end" font-family="monospace" font-size="10.5" letter-spacing=".8" fill="#8FA8C0">GITHUB.COM/THIAGOKAORU</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="409" rx="21" stroke="#B2D2E8" stroke-opacity=".19"/>
</svg>
