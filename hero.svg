<svg width="1200" height="385" viewBox="0 0 1200 385" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Thiago Kaoru — Senior Software Engineer</title>
<desc id="desc">A dark editorial developer banner with a subtle architecture graph connecting product engineering, backend systems, and AI.</desc>
<defs>
  <linearGradient id="back" x1="20" y1="20" x2="1170" y2="390" gradientUnits="userSpaceOnUse"><stop stop-color="#0A1225"/><stop offset="0.55" stop-color="#0B1121"/><stop offset="1" stop-color="#0B1C2A"/></linearGradient>
  <radialGradient id="soft" cx="0" cy="0" r="1" gradientTransform="translate(962 180) rotate(90) scale(260 345)" gradientUnits="userSpaceOnUse"><stop stop-color="#1B5272" stop-opacity=".50"/><stop offset="1" stop-color="#163C60" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="35" y1="0" x2="550" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#B8FFB0"/><stop offset="1" stop-color="#81D4FE"/></linearGradient>
  <linearGradient id="line" x1="760" y1="100" x2="1115" y2="290" gradientUnits="userSpaceOnUse"><stop stop-color="#A6FFD3" stop-opacity=".5"/><stop offset="1" stop-color="#78A6FA" stop-opacity=".2"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1" fill="#A1B5D8" opacity=".14"/></pattern>
  <clipPath id="crop"><rect x="1" y="1" width="1198" height="383" rx="22"/></clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
